spring.application.name=ContactManager

# ==============================
# Server Config
# ==============================
server.port=${PORT:8080}

# ==============================
# PostgreSQL Database Config
# ==============================
#spring.datasource.url=jdbc:postgresql://ep-red-snow-b3uen4iv-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
#spring.datasource.username=neondb_owner
#spring.datasource.password=npg_05HfCWBKgLGA
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate Config
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# JWT Config
# ==============================
# IMPORTANT: Change this secret to a strong random string in production!
#app.jwt.secret=MyVerySecretKeyThatShouldBeAtLeast256BitsLongForHS256Algorithm!
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
# 86400000 ms = 24 hours

# ==============================
# CORS Config (handled in code too)
# ==============================
app.cors.allowed-origins=http://localhost:3000,https://contact-manager-spring-react-app.vercel.app